```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Descargar archivo 1.bat</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 550px;

            background: white;
            padding: 45px 35px;

            text-align: center;

            border-radius: 20px;

            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.25);
        }

        .icono {
            font-size: 70px;
            margin-bottom: 15px;
        }

        h1 {
            color: #1e3c72;
            margin-bottom: 15px;
            font-size: 30px;
        }

        p {
            color: #555;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .archivo {
            background: #f1f5f9;
            border: 1px solid #d9e2ec;

            padding: 15px;
            margin-bottom: 25px;

            border-radius: 10px;

            font-family: Consolas, monospace;
            font-size: 16px;
            color: #333;
        }

        .btn-descargar {
            display: inline-block;

            background: #1976d2;
            color: white;

            padding: 15px 30px;

            border-radius: 10px;

            text-decoration: none;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: all 0.25s ease;

            box-shadow: 0 5px 15px rgba(25, 118, 210, 0.3);
        }

        .btn-descargar:hover {
            background: #125aa0;
            transform: translateY(-3px);

            box-shadow:
                0 8px 20px rgba(25, 118, 210, 0.4);
        }

        .btn-descargar:active {
            transform: translateY(0);
        }

        .info {
            margin-top: 25px;

            font-size: 13px;
            color: #777;
        }

        footer {
            margin-top: 30px;

            font-size: 12px;
            color: #999;
        }

        @media (max-width: 600px) {

            .contenedor {
                padding: 35px 20px;
            }

            h1 {
                font-size: 25px;
            }

            .icono {
                font-size: 55px;
            }

            .btn-descargar {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <div class="icono">
            📦
        </div>

        <h1>Descargar archivo</h1>

        <p>
            Hacé clic en el botón para descargar
            el archivo BAT.
        </p>

        <div class="archivo">
            📄 1.bat
        </div>

        <a
            href="1.bat"
            download="1.bat"
            class="btn-descargar"
            id="btnDescargar"
        >
            ⬇ Descargar 1.bat
        </a>

        <div class="info">
            El archivo se descargará directamente a tu computadora.
        </div>

        <footer>
            Página de descarga
        </footer>

    </main>

    <script>
        document
            .getElementById("btnDescargar")
            .addEventListener("click", function () {

                console.log("Descarga solicitada: 1.bat");

            });
    </script>

</body>
</html>
